services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: receipt-ai-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-billproject}
    volumes:
      # Database data persistence
      - postgres_data:/var/lib/postgresql/data
      # Initialize database with migration scripts (Alphabetical order)
      # SQL files in /docker-entrypoint-initdb.d are executed in alphabetical order
      - ./md_files/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - receipt-ai-network

  # Express.js Server
  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: receipt-ai-server
    depends_on:
      db:
        condition: service_started
    environment:
      # Server Configuration
      PORT: 3000
      NODE_ENV: ${NODE_ENV:-production}

      # Database Configuration
      DB_USER: postgres
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-billproject}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}

      # JWT Authentication
      JWT_SECRET: ${JWT_SECRET:-change_this_in_production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      REFRESH_SECRET: ${REFRESH_SECRET:-change_this_in_production}

      # Cloudflare R2 (Object Storage)
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME}
      R2_ENDPOINT: ${R2_ENDPOINT}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL}

      # Email Configuration (Optional)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    ports:
      - "3000:3000"
    volumes:
      # Application files and folders
      - ./server.js:/app/server.js
      - ./routes:/app/routes
      - ./utils:/app/utils
      - ./frontend:/app/frontend
      - ./package.json:/app/package.json
      - ./package-lock.json:/app/package-lock.json
      - ./.env:/app/.env
      - /app/node_modules
    networks:
      - receipt-ai-network
    restart: on-failure
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s

volumes:
  postgres_data:
    driver: local

networks:
  receipt-ai-network:
    driver: bridge
