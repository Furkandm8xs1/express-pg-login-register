<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ayarlar - FişAl</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6fb;
            color: #1f2937;
            min-height: 100vh;
            padding: 24px;
        }

        .page {
            max-width: 760px;
            margin: 0 auto;
        }

        .top-actions {
            margin-bottom: 16px;
        }

        .back-link {
            text-decoration: none;
            color: #4f46e5;
            font-weight: 600;
        }

        .card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
            padding: 24px;
            margin-bottom: 18px;
        }

        h1 {
            margin-bottom: 8px;
        }

        .muted {
            color: #6b7280;
        }

        .profile-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 14px;
            margin-top: 18px;
        }

        .profile-item {
            background: #f9fafb;
            border-radius: 10px;
            padding: 12px 14px;
        }

        .profile-item .label {
            font-size: 0.82rem;
            color: #6b7280;
            display: block;
            margin-bottom: 4px;
        }

        .profile-item .value {
            font-size: 1rem;
            font-weight: 600;
            word-break: break-word;
        }

        .warning-box {
            border: 1px solid #fecaca;
            background: #fff1f2;
        }

        .warning-box h2 {
            color: #b91c1c;
            margin-bottom: 10px;
            font-size: 1.05rem;
        }

        .close-account-btn {
            margin-top: 14px;
            border: none;
            background: #dc2626;
            color: #fff;
            font-weight: 700;
            border-radius: 10px;
            padding: 12px 16px;
            cursor: pointer;
            transition: 0.2s;
        }

        .close-account-btn:hover {
            background: #b91c1c;
        }

        .status {
            margin-top: 12px;
            font-size: 0.92rem;
            color: #6b7280;
        }
    </style>
</head>

<body>
    <div class="page">
        <div class="top-actions">
            <a class="back-link" href="/my-receipts"><i class="fas fa-arrow-left"></i> Fişlerime Dön</a>
        </div>

        <section class="card">
            <h1>Ayarlar</h1>
            <p class="muted">Hesabınla ilgili temel bilgileri burada görebilirsin.</p>

            <div id="profileInfo" class="profile-grid">
                <div class="profile-item">
                    <span class="label">Durum</span>
                    <span class="value">Yükleniyor...</span>
                </div>
            </div>
            <p id="statusText" class="status"></p>
        </section>

        <section class="card warning-box">
            <h2><i class="fas fa-triangle-exclamation"></i> Hesabı Kapatma Talebi</h2>
            <p>Hesabını kapatmak istersen aşağıdaki butondan WhatsApp üzerinden bize mesaj atabilirsin.</p>
            <button id="closeAccountBtn" class="close-account-btn" type="button">Hesabını Kapat</button>
        </section>
    </div>

    <script src="/js/ayarlar.js" defer></script>
</body>

</html>
